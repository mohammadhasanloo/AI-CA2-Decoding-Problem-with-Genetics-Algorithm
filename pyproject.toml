[project]
name = "vigenere-key-search"
version = "1.0.0"
description = "Recovers a Vigenere cipher key with a genetic algorithm"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vigenere = "vigenere.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vigenere*"]
